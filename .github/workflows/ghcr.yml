name: publish to ghcr
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
jobs:
  push:
    name: Create build and push to GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2.2.1
      - id: string
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ github.repository_owner }}
      - uses: actions/checkout@v3.3.0
      - uses: docker/login-action@v2.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN }}
      - id: getversion
        uses: Saionaro/extract-package-version@v1.2.1
      - uses: actions/setup-node@v3.5.1
        with:
          node-version: 16
          cache: 'yarn'
      - run: yarn install
      - run: yarn build
      - uses: docker/build-push-action@v3.2.0
        if: github.ref != 'refs/heads/master'
        with:
          context: .
          file: DockerfileLight
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.lowercase }}/g5v:next
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v3.2.0
        if: github.ref == 'refs/heads/master'
        with:
          context: .
          file: DockerfileLight
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.lowercase }}/g5v:latest,ghcr.io/${{ steps.string.outputs.lowercase }}/g5v:${{ steps.getversion.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
