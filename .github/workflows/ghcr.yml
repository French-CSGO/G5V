name: publish to ghcr
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - master
jobs:
  push:
    name: Create build and push to GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0
      - id: string
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ github.repository_owner }}
      - uses: actions/checkout@v6.0.2
      - uses: docker/login-action@v4.1.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.TOKEN }}
      - id: getversion
        uses: Saionaro/extract-package-version@v1.4.0
      - uses: actions/setup-node@v6.3.0
        with:
          node-version: 18
          cache: 'yarn'
      - run: yarn install
      - run: yarn build
      - uses: docker/build-push-action@v7.1.0
        if: github.event_name == 'pull_request'
        with:
          context: .
          file: DockerfileLight
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7.1.0
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master'
        with:
          context: .
          file: DockerfileLight
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.lowercase }}/g5v:next
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7.1.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          context: .
          file: DockerfileLight
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.lowercase }}/g5v:latest,ghcr.io/${{ steps.string.outputs.lowercase }}/g5v:${{ steps.getversion.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
